<!doctype html>
<html lang="id">

        <span class="decor-cap__top"></span>

      </div>
      <div class="cover__decor cover__decor--bulb" aria-hidden="true">

        <p class="cover__badge">N U M E R A S I</p>

            <span class="cover__contact-name">Achmad Damanhuri (Damar)</span>
            <span class="cover__contact-links">
              <a href="https://wa.me/6281269527136">WhatsApp 081269527136</a>
              <a href="mailto:damar.achmad09@gmail.com">damar.achmad09@gmail.com</a>

          </address>

      <div class="contents__decor contents__decor--one" aria-hidden="true"></div>
      <div class="contents__decor contents__decor--two" aria-hidden="true"></div>
      <div class="contents__header">
        <div class="contents__mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>

        </p>

      <div class="page-list" id="page-list" aria-live="polite">

      </div>

  <script src="scripts/site.js" type="module"></script>
